<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>房源预订 - 直接预订最优价格</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
      color: #333;
      background-color: #f9f9f9;
    }

    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 1.1rem;
      opacity: 0.95;
    }

    nav {
      background: white;
      padding: 1rem 2rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 2rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: #667eea;
      font-weight: 600;
      cursor: pointer;
    }

    nav a:hover {
      color: #764ba2;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .properties-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }

    .property-card {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }

    .property-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }

    .property-image {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 3rem;
    }

    .property-info {
      padding: 1.5rem;
    }

    .property-name {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .property-location {
      color: #666;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .property-details {
      display: flex;
      gap: 1rem;
      margin: 1rem 0;
      font-size: 0.9rem;
      color: #666;
    }

    .property-rating {
      color: #ffc107;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .property-amenities {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin: 1rem 0;
    }

    .amenity {
      background: #f0f0f0;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #666;
    }

    .property-price {
      font-size: 1.8rem;
      color: #667eea;
      font-weight: 700;
      margin: 1rem 0;
    }

    .price-subtitle {
      font-size: 0.9rem;
      color: #999;
    }

    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .booking-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .booking-modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 8px;
      padding: 2rem;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .modal-header h2 {
      color: #333;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #999;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #333;
    }

    input, select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 1rem;
      font-family: inherit;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .price-summary {
      background: #f9f9f9;
      padding: 1rem;
      border-radius: 6px;
      margin: 1.5rem 0;
      border-left: 4px solid #667eea;
    }

    .price-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .price-total {
      font-size: 1.3rem;
      font-weight: 700;
      color: #667eea;
      border-top: 1px solid #ddd;
      padding-top: 0.5rem;
      margin-top: 0.5rem;
    }

    .success-message {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
    }

    .error-message {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .search-section {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 2rem;
    }

    .search-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }

    .footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 2rem;
      margin-top: 3rem;
    }

    @media (max-width: 768px) {
      header h1 {
        font-size: 1.8rem;
      }

      .properties-grid {
        grid-template-columns: 1fr;
      }

      .search-grid {
        grid-template-columns: 1fr;
      }

      nav ul {
        gap: 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>🏠 房源预订网站</h1>
    <p>直接预订，优惠价格，无中介费用</p>
  </header>

  <nav>
    <ul>
      <li><a onclick="showSection('properties')">房源</a></li>
      <li><a onclick="showSection('bookings')">我的预订</a></li>
      <li><a href="/import.html" target="_blank">📥 导入房源</a></li>
      <li><a href="/admin.html" target="_blank">📊 管理面板</a></li>
      <li><a onclick="showSection('about')">关于</a></li>
    </ul>
  </nav>

  <div class="container">
    <!-- 房源列表 -->
    <div id="properties" class="section active">
      <div class="search-section">
        <h2>搜索房源</h2>
        <div class="search-grid">
          <div class="form-group">
            <label>入住日期</label>
            <input type="date" id="searchCheckIn">
          </div>
          <div class="form-group">
            <label>退房日期</label>
            <input type="date" id="searchCheckOut">
          </div>
          <div class="form-group">
            <label>人数</label>
            <select id="searchGuests">
              <option value="">任意</option>
              <option value="1">1人</option>
              <option value="2">2人</option>
              <option value="3">3人</option>
              <option value="4">4人</option>
            </select>
          </div>
          <button onclick="filterProperties()">搜索</button>
        </div>
      </div>

      <div id="propertiesList" class="properties-grid"></div>
    </div>

    <!-- 我的预订 -->
    <div id="bookings" class="section">
      <h2>我的预订</h2>
      <input type="text" id="bookingCode" placeholder="输入预订编号查询..." style="width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: 1px solid #ddd; border-radius: 6px;">
      <button onclick="searchBooking()">查询预订</button>
      <div id="bookingResult" style="margin-top: 2rem;"></div>
    </div>

    <!-- 关于 -->
    <div id="about" class="section">
      <h2>关于我们</h2>
      <p style="margin-top: 1rem; line-height: 1.6;">
        欢迎来到我们的房源预订网站！我们提供最优惠的价格和最好的服务。通过直接预订，您可以：
      </p>
      <ul style="margin-top: 1rem; margin-left: 2rem; line-height: 1.8;">
        <li>获得最优价格 - 无中介费用</li>
        <li>直接与房东沟通</li>
        <li>安全可靠的预订系统</li>
        <li>24小时客户支持</li>
      </ul>
      <p style="margin-top: 2rem;">
        <strong>联系我们：</strong><br>
        邮箱：booking@property.com<br>
        电话：+86 123 4567 8900
      </p>
    </div>
  </div>

  <!-- 预订模态框 -->
  <div id="bookingModal" class="booking-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>预订房源</h2>
        <button class="close-btn" onclick="closeBookingModal()">✕</button>
      </div>

      <div id="modalMessage"></div>

      <form id="bookingForm" onsubmit="submitBooking(event)">
        <input type="hidden" id="propertyId">

        <div class="form-group">
          <label>入住日期</label>
          <input type="date" id="checkIn" required>
        </div>

        <div class="form-group">
          <label>退房日期</label>
          <input type="date" id="checkOut" required>
        </div>

        <div class="form-group">
          <label>人数</label>
          <select id="guests" required>
            <option value="">请选择</option>
            <option value="1">1人</option>
            <option value="2">2人</option>
            <option value="3">3人</option>
            <option value="4">4人</option>
            <option value="5">5人或以上</option>
          </select>
        </div>

        <div class="price-summary" id="priceSummary" style="display:none;">
          <div class="price-line">
            <span id="summaryNights">0晚 × ￥</span>
            <span id="summaryNightPrice">0/晚</span>
          </div>
          <div class="price-line price-total">
            <span>总价</span>
            <span id="summaryTotal">￥0</span>
          </div>
        </div>

        <div class="form-group">
          <label>姓名</label>
          <input type="text" id="fullName" required placeholder="请输入您的姓名">
        </div>

        <div class="form-group">
          <label>邮箱</label>
          <input type="email" id="email" required placeholder="请输入您的邮箱">
        </div>

        <div class="form-group">
          <label>电话</label>
          <input type="tel" id="phone" placeholder="请输入您的电话号码">
        </div>

        <button type="submit" style="width: 100%;">确认预订</button>
      </form>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 房源预订网站。保留所有权利。</p>
  </footer>

  <script>
    let properties = [];
    let currentProperty = null;

    // 初始化
    document.addEventListener('DOMContentLoaded', async () => {
      await loadProperties();

      // 设置日期选择器的最小日期为今天
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('checkIn').min = today;
      document.getElementById('checkOut').min = today;
      document.getElementById('searchCheckIn').min = today;
      document.getElementById('searchCheckOut').min = today;
    });

    // 加载房源列表
    async function loadProperties() {
      try {
        const response = await fetch('/api/properties');
        properties = await response.json();
        displayProperties(properties);
      } catch (error) {
        console.error('加载房源失败:', error);
      }
    }

    // 显示房源
    function displayProperties(propertiesToShow) {
      const list = document.getElementById('propertiesList');
      list.innerHTML = propertiesToShow.map(property => `
        <div class="property-card" onclick="openBookingModal('${property.id}')">
          <div class="property-image">
            ${property.bedrooms}🛏️
          </div>
          <div class="property-info">
            <div class="property-name">${property.name}</div>
            <div class="property-location">📍 ${property.location}</div>
            <div class="property-details">
              <span>${property.bedrooms}卧室</span>
              <span>${property.bathrooms}浴室</span>
              <span>最多${property.guests}人</span>
            </div>
            ${property.rating ? `<div class="property-rating">⭐ ${property.rating} (${property.reviews}条评价)</div>` : ''}
            <div class="property-amenities">
              ${property.amenities.slice(0, 3).map(a => `<span class="amenity">${a}</span>`).join('')}
            </div>
            <div class="property-price">
              ￥${property.pricePerNight}
              <div class="price-subtitle">/晚</div>
            </div>
            <button>查看详情 &rarr;</button>
          </div>
        </div>
      `).join('');
    }

    // 过滤房源
    function filterProperties() {
      const checkIn = document.getElementById('searchCheckIn').value;
      const checkOut = document.getElementById('searchCheckOut').value;
      const guests = document.getElementById('searchGuests').value;

      let filtered = properties;

      if (checkIn && checkOut) {
        const inDate = new Date(checkIn);
        const outDate = new Date(checkOut);

        if (inDate >= outDate) {
          alert('退房日期必须在入住日期之后');
          return;
        }

        filtered = filtered.filter(p => {
          const availFrom = new Date(p.availableDates.from);
          const availTo = new Date(p.availableDates.to);
          return inDate >= availFrom && outDate <= availTo;
        });
      }

      if (guests) {
        filtered = filtered.filter(p => p.guests >= parseInt(guests));
      }

      displayProperties(filtered);
    }

    // 打开预订模态框
    function openBookingModal(propertyId) {
      currentProperty = properties.find(p => p.id === propertyId);
      if (!currentProperty) return;

      document.getElementById('propertyId').value = propertyId;
      document.getElementById('modalMessage').innerHTML = '';
      document.getElementById('bookingForm').reset();
      document.getElementById('priceSummary').style.display = 'none';
      document.getElementById('bookingModal').classList.add('active');

      // 设置日期范围
      document.getElementById('checkIn').min = currentProperty.availableDates.from;
      document.getElementById('checkIn').max = currentProperty.availableDates.to;
      document.getElementById('checkOut').min = currentProperty.availableDates.from;
      document.getElementById('checkOut').max = currentProperty.availableDates.to;
    }

    // 关闭模态框
    function closeBookingModal() {
      document.getElementById('bookingModal').classList.remove('active');
      currentProperty = null;
    }

    // 计算价格
    function updatePrice() {
      const checkIn = document.getElementById('checkIn').value;
      const checkOut = document.getElementById('checkOut').value;

      if (!checkIn || !checkOut || !currentProperty) return;

      const start = new Date(checkIn);
      const end = new Date(checkOut);
      const nights = (end - start) / (1000 * 60 * 60 * 24);

      if (nights > 0) {
        const total = nights * currentProperty.pricePerNight;
        document.getElementById('priceSummary').style.display = 'block';
        document.getElementById('summaryNights').textContent = `${nights}晚 × ￥`;
        document.getElementById('summaryNightPrice').textContent = `${currentProperty.pricePerNight}/晚`;
        document.getElementById('summaryTotal').textContent = `￥${total.toFixed(2)}`;
      }
    }

    // 添加日期变更监听
    document.addEventListener('change', (e) => {
      if (e.target.id === 'checkIn' || e.target.id === 'checkOut') {
        updatePrice();
      }
    });

    // 提交预订
    async function submitBooking(event) {
      event.preventDefault();

      const booking = {
        propertyId: document.getElementById('propertyId').value,
        checkIn: document.getElementById('checkIn').value,
        checkOut: document.getElementById('checkOut').value,
        guests: document.getElementById('guests').value,
        fullName: document.getElementById('fullName').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value
      };

      try {
        const response = await fetch('/api/bookings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(booking)
        });

        const result = await response.json();

        if (response.ok) {
          const message = `
            <div class="success-message">
              <strong>✓ 预订成功！</strong><br>
              预订编号：${result.confirmationCode}<br>
              总价：￥${result.totalPrice.toFixed(2)}<br>
              <br>
              确认邮件已发送至 ${result.email}
            </div>
          `;
          document.getElementById('modalMessage').innerHTML = message;
          document.getElementById('bookingForm').style.display = 'none';

          setTimeout(() => {
            closeBookingModal();
            document.getElementById('bookingForm').style.display = 'form';
          }, 3000);
        } else {
          document.getElementById('modalMessage').innerHTML = `<div class="error-message">${result.error}</div>`;
        }
      } catch (error) {
        document.getElementById('modalMessage').innerHTML = `<div class="error-message">预订失败，请重试</div>`;
        console.error('预订失败:', error);
      }
    }

    // 搜索预订
    async function searchBooking() {
      const code = document.getElementById('bookingCode').value.trim();
      if (!code) {
        alert('请输入预订编号');
        return;
      }

      try {
        const response = await fetch(`/api/bookings/${code}`);
        const result = await response.json();

        if (response.ok) {
          const bookingHtml = `
            <div class="success-message">
              <h3>${result.propertyName}</h3>
              <p><strong>预订编号：</strong> ${result.confirmationCode}</p>
              <p><strong>入住：</strong> ${new Date(result.checkIn).toLocaleDateString('zh-CN')}</p>
              <p><strong>退房：</strong> ${new Date(result.checkOut).toLocaleDateString('zh-CN')}</p>
              <p><strong>晚数：</strong> ${result.nights}</p>
              <p><strong>人数：</strong> ${result.guests}</p>
              <p><strong>总价：</strong> ￥${result.totalPrice.toFixed(2)}</p>
              <p><strong>状态：</strong> ${result.status}</p>
            </div>
          `;
          document.getElementById('bookingResult').innerHTML = bookingHtml;
        } else {
          document.getElementById('bookingResult').innerHTML = `<div class="error-message">预订未找到</div>`;
        }
      } catch (error) {
        document.getElementById('bookingResult').innerHTML = `<div class="error-message">查询失败，请重试</div>`;
        console.error('查询失败:', error);
      }
    }

    // 显示不同部分
    function showSection(sectionId) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById(sectionId).classList.add('active');
    }

    // 点击模态框外部关闭
    document.getElementById('bookingModal')?.addEventListener('click', (e) => {
      if (e.target.id === 'bookingModal') {
        closeBookingModal();
      }
    });
  </script>
</body>
</html>
